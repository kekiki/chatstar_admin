<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>APP管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        .toast-container .toast {
            min-width: 280px;
        }
        .sidebar {
            width: 240px;
            background: #212529;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        .main-content {
            margin-left: 240px;
            padding: 20px;
        }
        .sidebar a {
            color: #adb5bd;
            padding: 12px 20px;
            display: block;
            text-decoration: none;
        }
        .sidebar a.active {
            background: #0d6efd;
            color: white;
        }
        .compact-table {
            font-size: 0.82rem;
        }
        .compact-table th,
        .compact-table td {
            white-space: nowrap;
            vertical-align: middle;
            padding: 0.45rem 0.55rem;
        }
        .compact-table .ellipsis-cell {
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .compact-table .small-cell {
            max-width: 90px;
        }
        .compact-table .avatar-thumb img,
        .compact-table .cover-thumb img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .compact-table .cover-thumb img {
            border-radius: 0;
        }
        .compact-table .action-cell {
            min-width: 120px;
        }
        .compact-table td:last-child .btn-sm,
        .compact-table td:last-child .btn {
            padding: 0.18rem 0.35rem;
            font-size: 0.72rem;
            line-height: 1.1;
        }
        .compact-table td:last-child .btn + .btn {
            margin-left: 0.2rem;
        }
    </style>
    <script>
function showToast(msg, type) {
    type = type || 'success';
    var bgClass = type === 'error' ? 'bg-danger' : type === 'warning' ? 'bg-warning' : 'bg-success';
    var icon = type === 'error' ? '&#10060;' : type === 'warning' ? '&#9888;&#65039;' : '&#9989;';
    var id = 'toast-' + Date.now();
    var html = '<div id="' + id + '" class="toast align-items-center text-white ' + bgClass + ' border-0" role="alert">' +
        '<div class="d-flex"><div class="toast-body">' + icon + ' ' + msg + '</div>' +
        '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>';
    $('.toast-container').append(html);
    var toastEl = document.getElementById(id);
    var toast = new bootstrap.Toast(toastEl, {delay: 2000});
    toast.show();
    $(toastEl).on('hidden.bs.toast', function() { $(this).remove(); });
}

function apiRequest(url, method, body, opts) {
    opts = opts || {};
    var fetchOpts = {method: method, headers: {'Content-Type': 'application/json'}};
    if (body) fetchOpts.body = JSON.stringify(body);
    return fetch(url, fetchOpts).then(function(res) {
        if (res.status === 401) {
            showToast('登录已过期，请重新登录', 'error');
            setTimeout(function(){ window.location.href = '/login'; }, 1500);
            return;
        }
        return res.json().then(function(data) {
            if (res.ok && data.code === 200) {
                if (opts.successMsg !== false) showToast(opts.successMsg || data.msg || '操作成功');
                if (opts.onSuccess) opts.onSuccess(data);
            } else {
                var msg = data.msg || data.detail || '操作失败';
                if (typeof data.detail === 'object' && data.detail.length) {
                    msg = data.detail.map(function(d){ return d.msg || d.type; }).join('; ');
                }
                showToast(msg, 'error');
                if (opts.onError) opts.onError(data);
            }
        });
    }).catch(function(err) {
        console.error(err);
        showToast('网络错误，请稍后重试', 'error');
    });
}

function setupModalEnter(modalId, submitBtnId) {
    $('#' + modalId).on('keydown', function(e) {
        if (e.key === 'Enter' && !$(e.target).is('textarea')) {
            e.preventDefault();
            $('#' + submitBtnId).click();
        }
    });
}
    </script>
</head>
<body>
<!-- 左侧侧边栏 -->
<div class="sidebar">
    <div class="p-3 text-white fs-5 border-bottom border-secondary">APP管理后台</div>
    <a href="/admin/dashboard" class="{% if active_menu == 'dashboard' %}active{% endif %}">实时看板</a>
    <a href="/admin/user" class="{% if active_menu == 'user' %}active{% endif %}">用户列表</a>
    <a href="/admin/anchor" class="{% if active_menu == 'anchor' %}active{% endif %}">主播列表</a>
    <a href="/admin/order" class="{% if active_menu == 'order' %}active{% endif %}">订单列表</a>
    <a href="/admin/app_list" class="{% if active_menu == 'app_list' %}active{% endif %}">应用列表</a>
    <a href="/admin/app_review" class="{% if active_menu == 'app_review' %}active{% endif %}">审核配置</a>
    <a href="/admin/product" class="{% if active_menu == 'product' %}active{% endif %}">商品配置</a>
    <a href="/admin/gift" class="{% if active_menu == 'gift' %}active{% endif %}">礼物配置</a>
    <a href="/admin/media" class="{% if active_menu == 'media' %}active{% endif %}">媒体管理</a>
    <a href="/admin/task" class="{% if active_menu == 'task' %}active{% endif %}">任务配置</a>
    <div class="border-top border-secondary mt-3">
        <a href="/logout">退出登录</a>
    </div>
</div>

<!-- 右侧内容区域 -->
<div class="main-content">
    {% block content %}{% endblock %}
</div>

<!-- 全局 Toast 容器 -->
<div class="toast-container"></div>

</body>
</html>
