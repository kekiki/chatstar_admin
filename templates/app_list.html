{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>应用列表</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAppModal">新增应用</button>
</div>
<hr>
<div class="card mb-4">
    <div class="table-responsive">
        <table class="table table-hover table-striped mb-0 compact-table">
            <thead class="table-dark">
                <tr>
                    <th class="small-cell">应用ID</th>
                    <th class="ellipsis-cell">应用名称</th>
                    <th class="ellipsis-cell">包名</th>
                    <th class="small-cell">上架</th>
                    <th class="action-cell">操作</th>
                </tr>
            </thead>
            <tbody>
                {% for app in apps %}
                <tr>
                    <td>{{ app.id }}</td>
                    <td class="ellipsis-cell" title="{{ app.app_name }}">{{ app.app_name }}</td>
                    <td class="ellipsis-cell" title="{{ app.package_name }}">{{ app.package_name }}</td>
                    <td>
                        {% if app.is_online %}
                        <span class="badge bg-success">已上架</span>
                        {% else %}
                        <span class="badge bg-secondary">未上架</span>
                        {% endif %}
                    </td>
                    <td>
                        <button type="button" class="btn btn-sm btn-secondary btn-edit" data-id="{{ app.id }}" data-name="{{ app.app_name }}" data-package_name="{{ app.package_name }}" data-online="{{ 'true' if app.is_online else 'false' }}">编辑</button>
                        <button type="button" class="btn btn-sm btn-danger btn-delete" data-id="{{ app.id }}">删除</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- 新增应用弹窗 -->
<div class="modal fade" id="addAppModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新增APP应用</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addAppForm">
                    <div class="mb-3">
                        <label>应用名称</label>
                        <input type="text" name="app_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>包名（唯一标识）</label>
                        <input type="text" name="package_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <p><label>上架状态</label></p>
                        <label class="radio-item">
                            <input type="radio" name="is_online" value="true" checked>
                            <span>已上架</span>
                        </label>
                        &emsp;
                        <label class="radio-item">
                            <input type="radio" name="is_online" value="false">
                            <span>未上架</span>
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-success" id="submitAddApp">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- 编辑应用弹窗 -->
<div class="modal fade" id="editAppModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑APP应用</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editAppForm">
                    <input type="hidden" name="id">
                    <div class="mb-3">
                        <label>应用名称</label>
                        <input type="text" name="app_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>包名（唯一标识）</label>
                        <input type="text" name="package_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <p><label>上架状态</label></p>
                        <label class="radio-item">
                            <input type="radio" name="is_online" value="true">
                            <span>已上架</span>
                        </label>
                        &emsp;
                        <label class="radio-item">
                            <input type="radio" name="is_online" value="false">
                            <span>未上架</span>
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-success" id="submitEditApp">保存修改</button>
            </div>
        </div>
    </div>
</div>

<!-- 查看弹窗 -->
<div class="modal fade" id="configModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5>应用详情</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <pre id="configText"></pre>
            </div>
        </div>
    </div>
</div>

<script>
setupModalEnter('addAppModal', 'submitAddApp');
setupModalEnter('editAppModal', 'submitEditApp');

$(".view-config").click(function(){
    let cfg = $(this).data("config");
    $("#configText").text(JSON.stringify(JSON.parse(cfg), null, 2));
    new bootstrap.Modal("#configModal").show();
})

function openEditModal(app) {
    const modal = new bootstrap.Modal(document.getElementById('editAppModal'));
    const form = $("#editAppForm");
    form.find("[name=id]").val(app.id);
    form.find("[name=app_name]").val(app.app_name);
    form.find("[name=package_name]").val(app.package_name);
    form.find("[name=is_online][value=" + app.is_online + "]").prop("checked", true);
    modal.show();
}

$(document).on('click', '.btn-edit', function(){
    openEditModal({
        id: $(this).data('id'),
        app_name: $(this).data('name'),
        package_name: $(this).data('package_name'),
        is_online: $(this).data('online')
    });
});

$(document).on('click', '.btn-delete', function(){
    const id = $(this).data('id');
    const $tr = $(this).closest('tr');
    apiRequest("/admin/api/delete_app_list?id=" + id, "DELETE", null, {
        onSuccess: function(){ $tr.fadeOut(300, function(){ $(this).remove(); }); }
    });
});

$("#submitAddApp").click(function(){
    const form = $("#addAppForm");
    const app_name = form.find("[name=app_name]").val();
    const package_name = form.find("[name=package_name]").val();
    if (!app_name || !package_name) { showToast("请填写应用名称和包名", "warning"); return; }
    apiRequest("/admin/api/add_app_list", "POST", {
        app_name, package_name,
        is_online: form.find("[name=is_online]:checked").val() === "true"
    }, {onSuccess: function(){ bootstrap.Modal.getInstance(document.getElementById('addAppModal'))?.hide(); setTimeout(function(){ location.reload(); }, 800); }});
});

$("#submitEditApp").click(function(){
    const form = $("#editAppForm");
    const id = form.find("[name=id]").val();
    const app_name = form.find("[name=app_name]").val();
    const package_name = form.find("[name=package_name]").val();
    if (!id || !app_name || !package_name) { showToast("请填写完整的应用信息", "warning"); return; }
    apiRequest("/admin/api/update_app_list", "PUT", {
        id: Number(id), app_name, package_name,
        is_online: form.find("[name=is_online]:checked").val() === "true"
    }, {onSuccess: function(){ bootstrap.Modal.getInstance(document.getElementById('editAppModal'))?.hide(); setTimeout(function(){ location.reload(); }, 800); }});
});
</script>
{% endblock %}
